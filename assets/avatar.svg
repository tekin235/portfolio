<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="avatar-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="skin-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
  </defs>

  <!-- Background Circle Glow -->
  <circle cx="150" cy="150" r="140" fill="url(#avatar-grad)"/>
  
  <!-- Silhouette / Creative Avatar Character -->
  <g transform="translate(0, 10)">
    <!-- Clothes -->
    <path d="M70 280 C 70 210, 110 195, 150 195 C 190 195, 230 210, 230 280 Z" fill="#0f172a"/>
    <!-- Collar / Accent -->
    <path d="M125 195 L 150 225 L 175 195 Z" fill="#6366f1"/>

    <!-- Neck -->
    <rect x="135" y="160" width="30" height="38" rx="8" fill="#fbcfe8"/>

    <!-- Head -->
    <ellipse cx="150" cy="120" rx="45" ry="52" fill="#fbcfe8"/>

    <!-- Hair (Modern sleek cut) -->
    <path d="M100 115 C 95 60, 140 40, 180 50 C 210 60, 205 105, 200 125 C 190 100, 180 85, 150 85 C 120 85, 108 95, 100 115 Z" fill="#1e1b4b"/>
    <path d="M100 115 C 95 140, 102 165, 105 170 C 102 150, 105 125, 115 110 Z" fill="#1e1b4b"/>

    <!-- Glasses (Designer style) -->
    <rect x="115" y="110" width="28" height="20" rx="5" fill="none" stroke="#0f172a" stroke-width="3.5"/>
    <rect x="157" y="110" width="28" height="20" rx="5" fill="none" stroke="#0f172a" stroke-width="3.5"/>
    <line x1="143" y1="120" x2="157" y2="120" stroke="#0f172a" stroke-width="3.5"/>
    <line x1="105" y1="118" x2="115" y2="118" stroke="#0f172a" stroke-width="3.5"/>
    <line x1="185" y1="118" x2="195" y2="118" stroke="#0f172a" stroke-width="3.5"/>

    <!-- Subtle Smile -->
    <path d="M140 148 Q 150 156, 160 148" fill="none" stroke="#be185d" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Figma / Design Cursor Accent -->
    <g transform="translate(205, 160)">
      <polygon points="0,0 20,6 12,12 18,24 14,26 8,14 0,18" fill="#000" stroke="#fff" stroke-width="1.5"/>
      <rect x="18" y="18" width="60" height="20" rx="5" fill="#ec4899"/>
      <text x="48" y="32" fill="#ffffff" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">Designer</text>
    </g>
  </g>
</svg>
