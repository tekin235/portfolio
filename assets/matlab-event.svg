<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-matlab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1322" />
      <stop offset="50%" stop-color="#172033" />
      <stop offset="100%" stop-color="#080c16" />
    </linearGradient>
    <linearGradient id="matlab-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="shadow-poster-mat" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg-matlab)" rx="16"/>
  <circle cx="250" cy="150" r="180" fill="#ea580c" opacity="0.12" filter="blur(70px)"/>
  <circle cx="600" cy="380" r="160" fill="#38bdf8" opacity="0.08" filter="blur(60px)"/>

  <!-- MATLAB Main Event Poster Mockup (Center-Left) -->
  <g transform="translate(100, 35)" filter="url(#shadow-poster-mat)">
    <rect width="320" height="430" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    
    <!-- Top Event Header -->
    <rect width="320" height="6" fill="url(#matlab-grad)"/>
    
    <text x="24" y="36" fill="#f97316" font-size="10" font-family="sans-serif" font-weight="800" letter-spacing="2">TECHNICAL WORKSHOP 2026</text>
    <text x="296" y="36" fill="#94a3b8" font-size="9" font-family="monospace" text-anchor="end">LIVE IN-PERSON</text>

    <!-- Poster Main Headline -->
    <text x="24" y="78" fill="#f8fafc" font-size="28" font-family="sans-serif" font-weight="900" letter-spacing="-0.5">MASTERING</text>
    <text x="24" y="112" fill="url(#matlab-grad)" font-size="34" font-family="sans-serif" font-weight="900" letter-spacing="-1">MATLAB</text>
    <text x="24" y="132" fill="#94a3b8" font-size="11" font-family="sans-serif">Data Simulation • Signal Processing • Numerical Computing</text>

    <!-- Graphic Mesh / Vector Math Curve Artwork -->
    <g transform="translate(24, 150)">
      <rect width="272" height="150" rx="10" fill="#1e293b" opacity="0.6" stroke="#334155" stroke-width="1"/>
      
      <!-- 3D Mathematical Mesh Wave Wireframe -->
      <path d="M10 120 Q 50 30, 90 70 T 170 30 T 260 90" fill="none" stroke="#ea580c" stroke-width="2.5"/>
      <path d="M10 100 Q 50 10, 90 50 T 170 10 T 260 70" fill="none" stroke="#f97316" stroke-width="1.8" opacity="0.8"/>
      <path d="M10 80 Q 50 -10, 90 30 T 170 -10 T 260 50" fill="none" stroke="#fbbf24" stroke-width="1.2" opacity="0.6"/>
      <path d="M10 140 Q 50 50, 90 90 T 170 50 T 260 110" fill="none" stroke="#ea580c" stroke-width="1.5" opacity="0.5"/>

      <!-- Connecting Grid Nodes -->
      <circle cx="90" cy="70" r="4" fill="#fbbf24"/>
      <circle cx="170" cy="30" r="4" fill="#fbbf24"/>
      <circle cx="50" cy="30" r="3" fill="#f97316"/>
      <circle cx="215" cy="60" r="3" fill="#f97316"/>

      <!-- Matrix Code Overlay -->
      <text x="255" y="24" fill="#38bdf8" font-size="9" font-family="monospace" text-anchor="end">f(x,y)=sin(r)/r</text>
    </g>

    <!-- Event Date, Venue & Registration Strip -->
    <g transform="translate(24, 320)">
      <rect width="272" height="75" rx="8" fill="#1e293b"/>
      
      <text x="16" y="22" fill="#94a3b8" font-size="8" font-family="sans-serif">DATE &amp; TIME</text>
      <text x="16" y="38" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="bold">OCTOBER 15, 2026</text>
      <text x="16" y="52" fill="#fbbf24" font-size="10" font-family="sans-serif">10:00 AM - 4:00 PM</text>

      <line x1="150" y1="12" x2="150" y2="62" stroke="#334155" stroke-width="1"/>

      <text x="165" y="22" fill="#94a3b8" font-size="8" font-family="sans-serif">VENUE</text>
      <text x="165" y="38" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="bold">LAB 04, TECH BLOCK</text>
      <text x="165" y="52" fill="#38bdf8" font-size="10" font-family="sans-serif">Seats Limited • Certs Provided</text>
    </g>
  </g>

  <!-- Social Media Announcement Card Mockup (Right) -->
  <g transform="translate(460, 95)" filter="url(#shadow-poster-mat)">
    <rect width="240" height="280" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect width="240" height="4" fill="url(#matlab-grad)"/>

    <text x="20" y="32" fill="#38bdf8" font-size="9" font-family="sans-serif" font-weight="bold">INSTAGRAM POST FORMAT</text>
    <text x="20" y="56" fill="#f8fafc" font-size="16" font-family="sans-serif" font-weight="bold">REGISTRATIONS OPEN</text>

    <!-- Speaker Badge -->
    <g transform="translate(20, 80)">
      <circle cx="30" cy="30" r="28" fill="#1e293b" stroke="#f97316" stroke-width="2"/>
      <circle cx="30" cy="24" r="12" fill="#cbd5e1"/>
      <path d="M12 50 C12 38, 20 36, 30 36 C40 36, 48 38, 48 50 Z" fill="#64748b"/>
      
      <text x="70" y="25" fill="#f8fafc" font-size="12" font-family="sans-serif" font-weight="bold">Guest Mentor</text>
      <text x="70" y="40" fill="#94a3b8" font-size="10" font-family="sans-serif">Industry Specialist</text>
    </g>

    <!-- CTA Box -->
    <g transform="translate(20, 180)">
      <rect width="200" height="40" rx="8" fill="url(#matlab-grad)"/>
      <text x="100" y="25" fill="#ffffff" font-size="12" font-family="sans-serif" font-weight="bold" text-anchor="middle">Scan QR To Register →</text>
    </g>

    <text x="120" y="250" fill="#64748b" font-size="9" font-family="monospace" text-anchor="middle">FIGMA SOCIAL AD KIT</text>
  </g>
</svg>
